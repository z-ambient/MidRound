name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The suite is fully hermetic: each test file runs against its own
      # throwaway SQLite database (MIDROUND_DB_PATH) and never calls FACEIT.
      - name: Run tests
        run: npm test

      # Fails the build if any dependency has a known CVE, so we hear about
      # it from CI instead of an incident.
      - name: Audit dependencies for known vulnerabilities
        run: npm audit

  # The same suite against a real Postgres — proves the DATABASE_URL path
  # works before it ever reaches production. Serialized (--test-concurrency=1)
  # because all test files share the one service database.
  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: midround_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests against Postgres
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/midround_test
        run: node --test --test-concurrency=1
